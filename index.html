<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>XASİL Sohbet Ajanları - Siber AI & PWA</title>
    <meta name="description" content="Açık kaynaklı yerel model destekli ve akıllı yapay zeka ajanları ile Türkçe sohbet, hafıza paneli ve karakter stüdyosu uygulaması." />
    <meta name="theme-color" content="#00F0FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="XASİL AI" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/ic_launcher.svg" />
    <link rel="apple-touch-icon" href="/ic_launcher.svg" />
  </head>
  <body class="bg-[#050505] text-gray-200 selection:bg-[#00F0FF] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('PWA Service Worker registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
